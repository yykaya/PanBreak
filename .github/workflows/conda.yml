name: conda

on:
  push:
    branches: [main]
  pull_request:

jobs:
  environment:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v5
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: panbreak
          conda-remove-defaults: "true"
      - name: Tools
        run: |
          panbreak --version
          panbreak check --require minimap2 odgi minigraph blastn makeblastdb samtools
      - name: Unit and end-to-end tests
        run: python -m unittest discover -s tests -v

  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v5
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          auto-activate-base: true
          activate-environment: ""
          conda-remove-defaults: "true"
      - name: Build and test the conda package
        run: |
          conda install -n base -y -c conda-forge conda-build
          conda build -c conda-forge -c bioconda --override-channels conda
