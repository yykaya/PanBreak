{% set data = load_file_regex(load_file="../panbreak/__init__.py", regex_pattern='__version__ = "([^"]+)"', from_recipe_dir=True) %}

package:
  name: panbreak
  version: {{ data.group(1) }}

source:
  path: ..

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  entry_points:
    - panbreak = panbreak.cli:main

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=77
  run:
    - python >=3.10
    - pysam >=0.21
    - numpy >=1.22
    - matplotlib-base >=3.5
    - minimap2 >=2.24
    - odgi >=0.8
    - minigraph >=0.21

test:
  source_files:
    - tests
  imports:
    - panbreak
  commands:
    - panbreak --version
    - panbreak --help
    - panbreak check --require minimap2 odgi minigraph
    - python -m unittest discover -s tests -v

about:
  home: https://github.com/yykaya/PanBreak
  license: MIT
  license_file: LICENSE
  summary: Local pangenome graph bubble annotation and junction k-mer genotyping of structural variants and TE insertions from short reads
