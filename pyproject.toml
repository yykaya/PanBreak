[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "panbreak"
version = "0.2.0"
description = "Local pangenome graph construction, bubble annotation and junction k-mer genotyping of structural variants and TE insertions from short-read alignments"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{name = "Yasin Kaya", email = "yyasinkkaya@gmail.com"}]
dependencies = ["pysam>=0.21", "numpy>=1.22", "matplotlib>=3.5"]
keywords = ["pangenome", "pggb", "structural variants", "transposable elements", "k-mer", "genotyping", "population genetics"]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11",
               "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Operating System :: POSIX :: Linux",
               "Operating System :: MacOS", "Topic :: Scientific/Engineering :: Bio-Informatics"]

[project.urls]
Homepage = "https://github.com/yykaya/PanBreak"
Issues = "https://github.com/yykaya/PanBreak/issues"
Changelog = "https://github.com/yykaya/PanBreak/blob/main/CHANGELOG.md"

[project.scripts]
panbreak = "panbreak.cli:main"

[tool.setuptools]
packages = ["panbreak"]
